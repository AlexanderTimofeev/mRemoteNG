name: Patch native RDP SQL persistence

on:
  push:
    branches: [ agent/native-mstsc-launch ]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-rdp-sql-agent]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SQL persistence patch
        shell: pwsh
        run: |
          python tools/patch_native_rdp_sql.py
          git config user.name "native-rdp-sql-agent"
          git config user.email "native-rdp-sql-agent@users.noreply.github.com"
          git add -A
          if (-not (git diff --cached --quiet)) {
            git commit -m "feat: persist native RDP mode in SQL [native-rdp-sql-agent]"
            git push origin HEAD:${{ github.ref_name }}
          }
