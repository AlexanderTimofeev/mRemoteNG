name: Native RDP migration bootstrap

on:
  pull_request:
    branches: [v1.78.2-dev]

permissions:
  contents: write

jobs:
  run-current-migration-script:
    if: github.head_ref == 'agent/native-mstsc-launch-runner'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-mstsc-launch-runner
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract and run migration script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/native-rdp-migration.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = workflow.index(marker) + len(marker)
          lines = workflow[start:].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/native-rdp-migrate.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/native-rdp-migrate.sh
