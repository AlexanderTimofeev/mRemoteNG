name: Validate native RDP migration

on:
  push:
    branches:
      - v1.78.2-dev
    paths:
      - .github/workflows/validate-native-rdp.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-mstsc-launch
          fetch-depth: 0

      - name: Apply confirmed compiler fix
        shell: pwsh
        run: |
          $path = "mRemoteNG/Connection/ConnectionInfo.cs"
          $content = Get-Content $path -Raw
          if (-not $content.Contains("using mRemoteNG.Tools;")) {
            $content = $content.Replace(
              "using mRemoteNG.Tree.Root;",
              "using mRemoteNG.Tree.Root;`r`nusing mRemoteNG.Tools;`r`nusing mRemoteNG.Tools.Attributes;")
            Set-Content $path $content -NoNewline
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $path
          git commit -m "fix: import connection property-grid helpers"
          git push origin HEAD:agent/native-mstsc-launch

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Skip unavailable design-time T4 target during validation
        shell: pwsh
        run: |
          $project = "mRemoteNG/mRemoteNG.csproj"
          $content = Get-Content $project -Raw
          $old = '<Import Project="$(MSBuildExtensionsPath)\Microsoft\VisualStudio\v18.0\TextTemplating\Microsoft.TextTemplating.targets" />'
          $new = '<Import Project="$(MSBuildExtensionsPath)\Microsoft\VisualStudio\v18.0\TextTemplating\Microsoft.TextTemplating.targets" Condition="Exists(''$(MSBuildExtensionsPath)\Microsoft\VisualStudio\v18.0\TextTemplating\Microsoft.TextTemplating.targets'')" />'
          if (-not $content.Contains($old)) { throw "TextTemplating import anchor not found." }
          Set-Content $project ($content.Replace($old, $new)) -NoNewline

      - name: Restore, build and test with full MSBuild
        shell: pwsh
        run: |
          $report = "native-rdp-migration-build.txt"
          "Native RDP migration validation" | Set-Content $report
          "UTC: $([DateTime]::UtcNow.ToString('O'))" | Add-Content $report
          "HEAD: $(git rev-parse HEAD)" | Add-Content $report

          dotnet restore mRemoteNG.sln 2>&1 | Tee-Object -FilePath $report -Append
          $restoreExit = $LASTEXITCODE
          "RESTORE_EXIT=$restoreExit" | Add-Content $report

          $buildExit = -1
          $testExit = -1
          if ($restoreExit -eq 0) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
            if (-not $msbuild) { throw "Full Visual Studio MSBuild.exe was not found." }
            "MSBUILD=$msbuild" | Add-Content $report
            & $msbuild mRemoteNG.sln /t:Build /p:Configuration=Debug /p:Platform=x64 /p:RestorePackages=false /verbosity:minimal 2>&1 | Tee-Object -FilePath $report -Append
            $buildExit = $LASTEXITCODE
          }
          "BUILD_EXIT=$buildExit" | Add-Content $report

          if ($buildExit -eq 0) {
            dotnet test mRemoteNGTests/mRemoteNGTests.csproj --configuration Debug -p:Platform=x64 --no-build --no-restore 2>&1 | Tee-Object -FilePath $report -Append
            $testExit = $LASTEXITCODE
          }
          "TEST_EXIT=$testExit" | Add-Content $report
          "VALIDATION_COMPLETE=1" | Add-Content $report

          git checkout -- mRemoteNG/mRemoteNG.csproj
          git add $report
          git commit -m "chore: update native RDP migration validation"
          git push origin HEAD:agent/native-mstsc-launch
