name: Validate native RDP migration

on:
  push:
    branches:
      - v1.78.2-dev
    paths:
      - .github/workflows/validate-native-rdp.yml

permissions:
  contents: write

env:
  VALIDATION_REVISION: branch-restored-1

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/native-mstsc-launch
          fetch-depth: 0

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Skip unavailable design-time T4 target during validation
        shell: pwsh
        run: |
          $project = "mRemoteNG/mRemoteNG.csproj"
          $content = Get-Content $project -Raw
          $old = '<Import Project="$(MSBuildExtensionsPath)\Microsoft\VisualStudio\v18.0\TextTemplating\Microsoft.TextTemplating.targets" />'
          $new = '<Import Project="$(MSBuildExtensionsPath)\Microsoft\VisualStudio\v18.0\TextTemplating\Microsoft.TextTemplating.targets" Condition="Exists(''$(MSBuildExtensionsPath)\Microsoft\VisualStudio\v18.0\TextTemplating\Microsoft.TextTemplating.targets'')" />'
          if (-not $content.Contains($old)) { throw "TextTemplating import anchor not found." }
          Set-Content $project ($content.Replace($old, $new)) -NoNewline -Encoding utf8NoBOM

      - name: Restore, build and test with full MSBuild
        shell: pwsh
        run: |
          $report = "native-rdp-migration-build.txt"
          if (Test-Path $report) { Remove-Item $report -Force }

          @(
            "Native RDP migration validation",
            "UTC: $([DateTime]::UtcNow.ToString('O'))",
            "HEAD: $(git rev-parse HEAD)",
            "REVISION: $env:VALIDATION_REVISION"
          ) | Set-Content $report -Encoding utf8NoBOM

          $restoreOutput = & dotnet restore mRemoteNG.sln 2>&1
          $restoreExit = $LASTEXITCODE
          $restoreOutput | ForEach-Object { $_.ToString() } | Add-Content $report -Encoding utf8NoBOM
          "RESTORE_EXIT=$restoreExit" | Add-Content $report -Encoding utf8NoBOM

          $buildExit = -1
          $testExit = -1
          if ($restoreExit -eq 0) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
            if (-not $msbuild) { throw "Full Visual Studio MSBuild.exe was not found." }
            "MSBUILD=$msbuild" | Add-Content $report -Encoding utf8NoBOM

            $buildOutput = & $msbuild mRemoteNG.sln /t:Build /p:Configuration=Debug /p:Platform=x64 /p:RestorePackages=false /verbosity:minimal 2>&1
            $buildExit = $LASTEXITCODE
            $buildOutput | ForEach-Object { $_.ToString() } | Add-Content $report -Encoding utf8NoBOM
          }
          "BUILD_EXIT=$buildExit" | Add-Content $report -Encoding utf8NoBOM

          if ($buildExit -eq 0) {
            $testOutput = & dotnet test mRemoteNGTests/mRemoteNGTests.csproj --configuration Debug -p:Platform=x64 --no-build --no-restore 2>&1
            $testExit = $LASTEXITCODE
            $testOutput | ForEach-Object { $_.ToString() } | Add-Content $report -Encoding utf8NoBOM
          }
          "TEST_EXIT=$testExit" | Add-Content $report -Encoding utf8NoBOM
          "VALIDATION_COMPLETE=1" | Add-Content $report -Encoding utf8NoBOM

          git checkout -- mRemoteNG/mRemoteNG.csproj
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $report
          git commit -m "chore: update native RDP migration validation"
          git push origin HEAD:agent/native-mstsc-launch
