name: Native RDP migration patch

on:
  pull_request:
    branches: [v1.78.2-dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-integration-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-mstsc-launch-runner
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply integration changes
        shell: bash
        run: |
          bash .github/scripts/native-rdp-migrate-v2.sh
